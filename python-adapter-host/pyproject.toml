[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tribler-stremio-python-adapter"
version = "0.1.0"
description = "Local Python resolver host for Tribler Stremio Bridge"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["adapter_host*"]
